name: Deploy Pages

# Publishes the static SPA build to GitHub Pages.
# Self-managed (build_type = workflow) instead of the auto branch-deploy, which
# was intermittently failing with "Deployment failed, try again later" under
# rapid successive pushes. concurrency.cancel-in-progress collapses a burst of
# pushes into one deploy so they never pile up / get stuck.
on:
  push:
    branches: [ main ]
    # Everything docs/ is built FROM has to trigger a deploy. Filtering on
    # 'docs/**' alone meant a change to public/ or seed.js went green in CI and
    # never reached the published site, so Pages silently served older content
    # than main until someone happened to commit a rebuilt docs/.
    paths:
      - 'docs/**'
      - 'public/**'
      - 'seed.js'
      - 'scripts/build-static.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build rather than trust the committed docs/: what gets published is then
      # derived from the commit being deployed, not from whatever a contributor
      # last remembered to regenerate. CI's docs/ drift gate keeps the two equal.
      - name: Build static site
        run: node scripts/build-static.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
