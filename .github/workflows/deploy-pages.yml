name: Deploy Pages

# Publishes the pre-built ./docs (npm run build:static) to GitHub Pages.
# Self-managed (build_type = workflow) instead of the auto branch-deploy, which
# was intermittently failing with "Deployment failed, try again later" under
# rapid successive pushes. concurrency.cancel-in-progress collapses a burst of
# pushes into one deploy so they never pile up / get stuck.
on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', '.github/workflows/deploy-pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
