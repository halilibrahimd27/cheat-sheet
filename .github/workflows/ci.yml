name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Validate content (seed.js structure)
        run: npm run validate-content
      - name: README stats are in sync with seed.js
        run: |
          node scripts/update-readme.js
          git diff --exit-code README.md
